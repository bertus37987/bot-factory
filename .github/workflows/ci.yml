name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, Lint, Build & Tests
    runs-on: ubuntu-latest
    env:
      BOT_FACTORY_SKIP_PLAYWRIGHT: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck monorepo
        run: bun run typecheck

      - name: Lint with Biome
        run: bun run lint

      - name: Scan dependencies for supply-chain advisories
        run: bun run scan:security

      - name: Build Studio Web UI
        run: bun run build:web

      - name: Run integration and security tests
        run: bun test tests

  ui-e2e:
    name: Playwright Chromium UI E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Studio Web UI
        run: bun run build:web

      - name: Install Python Playwright
        run: python3 -m pip install playwright

      - name: Install Chromium
        run: python3 -m playwright install --with-deps chromium

      - name: Run browser UI E2E
        run: bun test tests/ui_e2e.test.ts
