<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bot-Factory — ui-08 · Command-First HUD + Floating Drawers</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#ffffff; --surface:#fafafa; --subtle:#f5f5f5; --hover:#f2f2f3; --active:#eaeaeb;
    --hair:#ebebeb; --hair-soft:#f2f2f2; --hair-strong:#dcdce0;
    --ink:#171717; --ink2:#525252; --muted:#8a8a8a; --faint:#a8a8a8;
    --ok-ink:#166534; --ok-bg:#f0fdf4; --ok-bd:#dcfce7;
    --info-ink:#1d4ed8; --info-bg:#f2f6fa; --info-bd:#d7e4f0;
    --warn-ink:#b45309; --warn-bg:#fffbeb; --warn-bd:#fde68a;
    --err-ink:#b91c1c; --err-bg:#fef2f2; --err-bd:#fecaca;
    --shadow-float: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px -6px rgba(0,0,0,.06);
    --shadow-pop: 0 1px 2px rgba(0,0,0,.05), 0 10px 28px -8px rgba(0,0,0,.10);
    --shadow-sheet: -12px 0 40px -18px rgba(0,0,0,.14);
    --sans:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;font-size:14px;overflow:hidden}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea{font-family:inherit;color:inherit}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-thumb{background:transparent;border-radius:3px}
  :hover::-webkit-scrollbar-thumb,::-webkit-scrollbar-thumb:hover{background:#d4d4d8}
  .num{font-variant-numeric:tabular-nums}
  svg{display:block}
  .ic{stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}

  /* ============ FLOATING HUD CLUSTERS ============ */
  .hud-tl{position:fixed;top:12px;left:12px;z-index:40;display:flex;align-items:center;gap:6px;
    background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border:1px solid var(--hair);border-radius:12px;
    padding:5px;box-shadow:var(--shadow-float)}
  .hud-modes{display:flex;background:var(--subtle);border:1px solid var(--hair);border-radius:8px;padding:2px;gap:2px}
  .hud-mode{width:26px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:all .15s var(--ease)}
  .hud-mode:hover{color:var(--ink)}
  .hud-mode.active{background:var(--bg);color:var(--ink);border:1px solid var(--hair);margin:-1px}
  .hud-mode svg{width:15px;height:15px}
  .hud-sep{width:1px;height:18px;background:var(--hair);margin:0 2px}
  .hud-btn{height:26px;min-width:26px;padding:0 7px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;gap:5px;color:var(--ink2);font-size:12px;font-weight:500}
  .hud-btn:hover{background:var(--hover);color:var(--ink)}
  .hud-btn.active{background:var(--active);color:var(--ink)}
  .hud-btn svg{width:14px;height:14px}
  .hud-crumb{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink2);padding:0 6px;max-width:250px;overflow:hidden;white-space:nowrap}
  .hud-crumb b{font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis}
  .hud-crumb svg{width:11px;height:11px;color:var(--faint)}
  .hud-k{display:flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:7px;border:1px solid var(--hair);background:var(--bg);color:var(--muted);font-size:12px}
  .hud-k:hover{border-color:var(--hair-strong);color:var(--ink2)}
  .hud-k kbd{font-family:var(--mono);font-size:10px;background:var(--subtle);border:1px solid var(--hair);border-radius:4px;padding:1px 5px;color:var(--ink2)}
  .hud-tr{position:fixed;top:12px;right:12px;z-index:40;display:flex;align-items:center;gap:6px;
    background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border:1px solid var(--hair);border-radius:12px;padding:5px;box-shadow:var(--shadow-float)}
  .hud-orb-slot{display:flex;align-items:center;justify-content:center;padding:0 3px}
  .hud-status{font-size:11px;color:var(--muted);padding-right:4px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ============ CANVAS / STREAM ============ */
  #canvas{position:fixed;inset:0;overflow-y:auto;padding:70px 20px 220px}
  .doc{max-width:720px;margin:0 auto}
  .ws-crumb{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-bottom:6px}
  .ws-crumb svg{width:12px;height:12px}
  .ws-title{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:600;letter-spacing:-.02em}
  .ws-meta{display:flex;align-items:center;gap:8px;margin:8px 0 4px;font-size:12px;color:var(--muted)}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;padding:2px 8px;border-radius:5px;border:1px solid var(--hair);background:var(--surface);color:var(--ink2)}
  .chip svg{width:11px;height:11px}
  .chip.mono{font-family:var(--mono);font-size:10.5px}
  .chip.ok{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok-ink)}
  .chip.warn{background:var(--warn-bg);border-color:var(--warn-bd);color:var(--warn-ink)}

  .msg{padding:16px 0}
  .msg + .msg{border-top:1px solid var(--hair-soft)}
  .msg-head{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .msg-head .who{font-size:12.5px;font-weight:600}
  .msg-head .time{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
  .u-bub{display:inline-block;background:var(--subtle);border:1px solid var(--hair);border-radius:10px;padding:8px 13px;font-size:14px;line-height:1.55;max-width:88%}
  .a-body{font-size:14.5px;line-height:1.66;color:#242424;letter-spacing:-.004em}
  .a-body p+p{margin-top:9px}
  .a-body code{font-family:var(--mono);font-size:12.5px;background:var(--subtle);border:1px solid var(--hair);border-radius:4px;padding:1px 5px}
  .a-body strong{font-weight:600}
  .avatar{display:flex;align-items:center;justify-content:center;flex:0 0 auto}

  .tool{border:1px solid var(--hair);border-radius:8px;background:var(--surface);margin:9px 0;overflow:hidden}
  .tool-head{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 10px;font-size:12.5px;color:var(--ink2)}
  .tool-head:hover{background:var(--hover)}
  .tool-head svg{width:13px;height:13px;color:var(--muted)}
  .tool-head .tt{flex:1;font-weight:500;color:var(--ink)}
  .tool-head .caret{transition:transform .18s var(--ease)}
  .tool.open .caret{transform:rotate(90deg)}
  .tool .t-status{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
  .tool.done .t-status{color:var(--ok-ink)}
  .tool-body{display:none;border-top:1px solid var(--hair);padding:8px 10px;background:var(--bg)}
  .tool.open .tool-body{display:block}
  .tool-body pre{font-family:var(--mono);font-size:11.5px;line-height:1.55;color:var(--ink2);overflow-x:auto;white-space:pre}

  .diffcard{border:1px solid var(--hair);border-radius:8px;margin:9px 0;overflow:hidden}
  .dc-head{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--surface);border-bottom:1px solid var(--hair);font-size:12px}
  .dc-head .f{font-family:var(--mono);font-size:11.5px;color:var(--ink);font-weight:500}
  .dc-stat{font-family:var(--mono);font-size:11px;font-weight:500}
  .dc-stat.add{color:var(--ok-ink)} .dc-stat.del{color:var(--err-ink)}
  .dc-rows{font-family:var(--mono);font-size:11.5px;line-height:1.6}
  .dc-row{display:flex;padding:0 10px;white-space:pre;color:var(--ink2)}
  .dc-row .ln{width:30px;flex:0 0 30px;color:var(--faint);text-align:right;padding-right:10px;user-select:none;font-variant-numeric:tabular-nums}
  .dc-row.add{background:#f2f8f5;color:#1c4a33}
  .dc-row.del{background:#fcf4f4;color:#6e2a2a}
  .dc-row.ctx{color:var(--muted)}

  .approval{border:1px solid var(--warn-bd);background:var(--warn-bg);border-radius:10px;padding:11px 13px;margin:10px 0}
  .ap-top{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--warn-ink)}
  .ap-top svg{width:14px;height:14px}
  .ap-desc{font-size:12.5px;color:#6b5424;margin:6px 0 10px;line-height:1.5}
  .ap-actions{display:flex;gap:6px}
  .btn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;padding:5px 11px;border-radius:6px;border:1px solid var(--hair);background:var(--bg);color:var(--ink);transition:all .15s var(--ease)}
  .btn:hover{background:var(--hover);border-color:var(--hair-strong)}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn.primary:hover{background:#2b2b2b}
  .btn.danger{background:var(--err-bg);border-color:var(--err-bd);color:var(--err-ink)}
  .btn.danger:hover{border-color:var(--err-ink)}
  .btn svg{width:13px;height:13px}
  .ap-resolved{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500}
  .ap-resolved.ok{color:var(--ok-ink)} .ap-resolved.no{color:var(--err-ink)}

  .outcomes{border:1px solid var(--hair);border-radius:8px;background:var(--surface);padding:9px 12px;margin:9px 0;font-size:12.5px}
  .outcomes .o{display:flex;align-items:center;gap:8px;padding:3px 0;color:var(--ink2)}
  .outcomes .o svg{width:13px;height:13px;color:var(--ok-ink);flex:0 0 auto}
  .outcomes .o b{color:var(--ink);font-weight:500}

  .mention{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:1px 8px 1px 5px;border-radius:999px;border:1px solid var(--hair);background:var(--bg);color:var(--ink);vertical-align:1px;margin:0 1px}
  .mention i{width:6px;height:6px;border-radius:50%;background:var(--info-ink);flex:0 0 auto;font-style:normal}
  .mention.arch i{background:#7c5c1e}.mention.ver i{background:var(--ok-ink)}.mention.lore i{background:var(--muted)}

  .statusline{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:4px 0}
  .cursor-blink{display:inline-block;width:7px;height:15px;background:var(--ink);vertical-align:-2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  /* ============ BOT FLEET ROOM (bots mode) ============ */
  .fleet{max-width:920px;margin:0 auto}
  .fleet-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:16px 0 22px}
  .bot-card{border:1px solid var(--hair);border-radius:10px;padding:12px;background:var(--surface);text-align:left}
  .bot-card:hover{background:var(--hover)}
  .bc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .bc-mark{width:26px;height:26px;border-radius:7px;background:var(--bg);border:1px solid var(--hair);display:flex;align-items:center;justify-content:center;color:var(--ink)}
  .bc-mark svg{width:14px;height:14px}
  .bc-name{font-size:12.5px;font-weight:600}
  .bc-role{font-size:11px;color:var(--muted);margin-top:1px}
  .bc-status{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:11px;color:var(--ink2)}
  .room-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--hair-soft)}
  .room-bar h3{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
  .pulse-dot{width:6px;height:6px;border-radius:50%;background:var(--ok-ink)}
  .room-ctl{display:flex;gap:6px;align-items:center}
  .room-ctl .chip{cursor:default}

  /* ============ FLOATING COMPOSER ============ */
  #composer-wrap{position:fixed;left:0;right:0;bottom:0;padding:0 20px 16px;display:flex;justify-content:center;pointer-events:none;z-index:30;
    background:linear-gradient(to top,var(--bg) 55%,rgba(255,255,255,0))}
  #composer-col{width:100%;max-width:720px;pointer-events:auto;position:relative}
  #diff-tray{display:flex;align-items:center;gap:8px;background:var(--subtle);border:1px solid var(--hair);border-bottom:none;
    border-radius:16px 16px 0 0;padding:7px 14px;font-size:12px;color:var(--ink2);margin:0 10px}
  #diff-tray svg{width:13px;height:13px;color:var(--muted)}
  #diff-tray .dt-label{font-weight:500;color:var(--ink)}
  #diff-tray .dt-add{color:var(--ok-ink);font-family:var(--mono);font-size:11px;font-weight:500}
  #diff-tray .dt-del{color:var(--err-ink);font-family:var(--mono);font-size:11px;font-weight:500}
  #diff-tray .dt-sp{flex:1}
  .dt-link{font-size:12px;font-weight:500;color:var(--ink);padding:2px 7px;border-radius:5px}
  .dt-link:hover{background:var(--active)}
  .dt-link.blue{color:var(--info-ink)}
  #diff-tray .dt-close{width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
  #diff-tray .dt-close:hover{background:var(--active);color:var(--ink)}
  #composer{background:var(--bg);border:1px solid var(--hair);border-radius:16px;box-shadow:var(--shadow-float)}
  #composer.flat-top{border-radius:0 0 16px 16px;border-top:none}
  #composer textarea{width:100%;border:none;outline:none;resize:none;background:none;font-size:14px;line-height:1.55;padding:13px 14px 6px;max-height:160px;min-height:44px;color:var(--ink)}
  #composer textarea::placeholder{color:var(--faint)}
  .cbar{display:flex;align-items:center;gap:5px;padding:7px 9px 9px;flex-wrap:wrap}
  .cbtn{height:28px;min-width:28px;padding:0 7px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;gap:5px;color:var(--ink2);font-size:12px;font-weight:500;border:1px solid transparent}
  .cbtn:hover{background:var(--hover);color:var(--ink)}
  .cbtn svg{width:14px;height:14px}
  .cbtn.bordered{border-color:var(--hair);color:var(--muted);font-family:var(--mono);font-size:11.5px}
  .cbtn.bordered:hover{color:var(--ink)}
  .cpill{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:6px;border:1px solid var(--hair);background:var(--bg);font-size:12px;font-weight:500;color:var(--ink2)}
  .cpill:hover{background:var(--hover);color:var(--ink)}
  .cpill svg{width:12px;height:12px;color:var(--muted)}
  .cpill.folder{font-family:var(--mono);font-size:11px}
  .cpill.pm{background:var(--info-bg);border-color:var(--info-bd);color:var(--info-ink)}
  .cbar .sp{flex:1}
  .ctxring{position:relative;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
  .ctxring svg{transform:rotate(-90deg)}
  .ctxring .pct{position:absolute;font-family:var(--mono);font-size:6.5px;color:var(--warn-ink);font-weight:500}
  #send{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;transition:background .15s var(--ease)}
  #send:hover{background:#2b2b2b}
  #send:disabled{background:#c9c9cc;cursor:default}
  #send svg{width:14px;height:14px}
  #runbar{display:none;align-items:center;gap:9px;padding:9px 14px;font-size:12.5px;color:var(--ink2)}
  #runbar .rb-txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #runbar .steer-btn{color:var(--info-ink);font-weight:500;font-size:12px;padding:3px 8px;border-radius:5px}
  #runbar .steer-btn:hover{background:var(--info-bg)}
  #runbar .stop-btn{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--err-ink);background:var(--err-bg);border:1px solid var(--err-bd);padding:3px 10px;border-radius:6px}
  #runbar .stop-btn svg{width:11px;height:11px}
  #runbar .pause-btn{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--warn-ink);background:var(--warn-bg);border:1px solid var(--warn-bd);padding:3px 10px;border-radius:6px}
  #runbar .pause-btn svg{width:11px;height:11px}

  .pop{position:absolute;background:var(--bg);border:1px solid var(--hair);border-radius:10px;box-shadow:var(--shadow-pop);padding:5px;min-width:180px;z-index:60;display:none}
  .pop.open{display:block}
  .pop .pi{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 9px;border-radius:6px;font-size:12.5px;color:var(--ink2)}
  .pop .pi:hover{background:var(--hover);color:var(--ink)}
  .pop .pi.sel{color:var(--ink);font-weight:500}
  .pop .pi svg{width:13px;height:13px;color:var(--muted)}
  .pop .pi .check{margin-left:auto;color:var(--ink);opacity:0}
  .pop .pi.sel .check{opacity:1}
  .pop .psec{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);padding:7px 9px 3px}

  /* ============ LEFT FLOATING DRAWER ============ */
  #drawer{position:fixed;top:64px;left:12px;bottom:14px;width:300px;z-index:50;background:var(--bg);
    border:1px solid var(--hair);border-radius:14px;box-shadow:var(--shadow-pop);
    display:flex;flex-direction:column;overflow:hidden;transform:translateX(-118%);opacity:0;
    transition:transform .26s var(--ease),opacity .2s var(--ease)}
  #drawer.open{transform:translateX(0);opacity:1}
  .dr-head{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-bottom:1px solid var(--hair)}
  .dr-title{font-size:12px;font-weight:600;letter-spacing:.02em}
  .dr-x{width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .dr-x:hover{background:var(--hover);color:var(--ink)}
  .dr-search{margin:9px 10px;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--hair);border-radius:7px;padding:5px 8px;color:var(--faint)}
  .dr-search input{border:none;outline:none;background:none;font-size:12px;width:100%;color:var(--ink)}
  .dr-scroll{flex:1;overflow-y:auto;padding:0 8px 10px}
  .dr-sec{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:11px 6px 4px}
  .dr-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 8px;border-radius:7px;font-size:12.5px;color:var(--ink2)}
  .dr-item:hover{background:var(--hover);color:var(--ink)}
  .dr-item.active{background:var(--active);color:var(--ink);font-weight:500}
  .dr-item svg{width:13px;height:13px;color:var(--muted);flex:0 0 auto}
  .dr-item .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dr-item .cnt{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
  .dr-sub{padding-left:15px;display:flex;flex-direction:column;gap:1px}
  .dr-leaf{display:flex;align-items:center;gap:7px;width:100%;text-align:left;padding:5px 8px;border-radius:6px;font-size:12px;color:var(--ink2)}
  .dr-leaf:hover{background:var(--hover);color:var(--ink)}
  .dr-leaf.active{background:var(--active);color:var(--ink);font-weight:500}
  .dr-leaf .dot{width:5px;height:5px;border-radius:50%;background:#d4d4d8;flex:0 0 auto}
  .dr-leaf.live .dot{background:var(--warn-ink)}
  .squad{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 8px;border-radius:8px}
  .squad:hover{background:var(--hover)}
  .squad.active{background:var(--active)}
  .squad .sq-body{flex:1;min-width:0}
  .squad .sq-name{font-size:12.5px;font-weight:500;color:var(--ink);display:flex;align-items:center;gap:6px}
  .squad .sq-status{font-size:11px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dr-foot{padding:8px;border-top:1px solid var(--hair)}
  .new-session{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;padding:6px;border-radius:7px;background:var(--hover);font-size:12.5px;font-weight:500;color:var(--ink2)}

<script>
"use strict";
/* ================= THINKING ORB ================= */
const ORBS=[];
const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;
class ThinkingOrb{
  constructor(wrap,size,state){
    this.size=size||20;this.state=state||"idle";this.t=Math.random()*60;this.raf=null;
    wrap.classList.add("orb");wrap.style.width=wrap.style.height=this.size+"px";
    wrap.setAttribute("role","img");wrap.setAttribute("aria-label","Agent status: "+this.state);
    const cv=document.createElement("canvas");
    const dpr=Math.min(2,window.devicePixelRatio||1);this.dpr=dpr;
    cv.width=cv.height=this.size*dpr;cv.style.width=cv.style.height="100%";
    wrap.appendChild(cv);this.cv=cv;this.ctx=cv.getContext("2d");
    const N=this.size>=48?190:(this.size>=20?105:56);
    const ga=Math.PI*(3-Math.sqrt(5));this.pts=[];
    for(let i=0;i<N;i++){
      const y=1-(i/(N-1))*2,r=Math.sqrt(Math.max(0,1-y*y)),th=ga*i;
      this.pts.push({x:Math.cos(th)*r,y:y*.94,z:Math.sin(th)*r,ph:(i*.61)%6.283});
    }
    wrap.dataset.state=this.state;this.wrap=wrap;this.draw(0);
    ORBS.push(this);
  }
  set(s){this.state=s;this.wrap.dataset.state=s;this.wrap.setAttribute("aria-label","Agent status: "+s);
    if(s==="idle"||s==="paused"||s==="blocked"||reduceMotion){this.stop();this.draw(this.t);}
    else this.start();}
  start(){if(reduceMotion||this.raf)return;
    const loop=()=>{if(document.hidden){this.raf=null;return;}
      if(this.state==="idle"||this.state==="paused"||this.state==="blocked"){this.raf=null;this.draw(this.t);return;}
      this.t+=.016;this.draw(this.t);this.raf=requestAnimationFrame(loop);};
    this.raf=requestAnimationFrame(loop);}
  stop(){if(this.raf){cancelAnimationFrame(this.raf);this.raf=null;}}
  draw(t){
    const c=this.ctx,R=this.size*this.dpr/2;
    c.clearRect(0,0,this.cv.width,this.cv.height);
    const sp={working:.75,searching:1.15,solving:.9,composing:1.5,shaping:.85,listening:.45,idle:0,paused:0,blocked:0}[this.state]||0;
    const rot=t*sp*1.5,br=this.state==="idle"?1:1+Math.sin(t*1.25)*.045;
    for(const p of this.pts){
      const x=p.x*Math.cos(rot)-p.z*Math.sin(rot);
      const z=p.x*Math.sin(rot)+p.z*Math.cos(rot);
      const y=p.y+(this.state==="idle"?0:Math.sin(t*1.7+p.ph)*.05);
      const d=(z+1)/2;
      const px=R+x*R*.7*br,py=R+y*R*.7*br;
      const a=this.state==="idle"?.08+d*.16:.10+d*.66;
      c.beginPath();c.fillStyle="rgba(23,23,23,"+a.toFixed(3)+")";
      c.arc(px,py,Math.max(.35,(.45+d*.95)*(this.size/20)*this.dpr*.6),0,6.2832);c.fill();
    }
  }
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)ORBS.forEach(o=>{if(o.state!=="idle"&&o.state!=="paused"&&o.state!=="blocked")o.start();});});

let runTimers=[];
function sendTurn(text){
  if(app.running)return;
  app.running=true;app.paused=false;
  $("#c-inner").style.display="none";$("#runbar").style.display="flex";
  const rw=$("#run-orb");rw.innerHTML="";
  const rorb=document.createElement("span");rw.appendChild(rorb);
  const orb=new ThinkingOrb(rorb,20,"working");
  setHud("working");
  const doc=$("#room-stream")||$("#doc")||(()=>{const d=document.createElement("div");d.className="doc";d.id="doc";canvasEl.appendChild(d);return d;})();
  const um=document.createElement("div");um.className="msg user";
  um.innerHTML=`<div class="msg-head"><span class="who">You</span><span class="time">now</span></div><div class="u-bub">${esc(text)}</div>`;
  doc.appendChild(um);
  const am=document.createElement("div");am.className="msg agent";
  const head=document.createElement("div");head.className="msg-head";
  const av=document.createElement("span");av.className="avatar";head.appendChild(av);
  const aorb=new ThinkingOrb(av,20,"working");
  head.insertAdjacentHTML("beforeend",`<span class="who">${app.view==="bots"?"PM Bot":"Agent"}</span><span class="time">now</span>`);
  am.appendChild(head);
  const body=document.createElement("div");am.appendChild(body);
  const st=document.createElement("div");st.className="statusline";st.innerHTML=`<span>Thinking</span><span class="cursor-blink"></span>`;body.appendChild(st);
  doc.appendChild(am);canvasEl.scrollTop=canvasEl.scrollHeight;
  const ta=$("#ta");if(ta){ta.value="";ta.style.height="auto";$("#send").disabled=true;}
  runTimers.push(setTimeout(()=>{
    if(app.paused)return;
    st.remove();$("#rb-txt").textContent="Reading spawn.lua and config.lua…";
    const tc=document.createElement("div");tc.className="tool open";
    tc.innerHTML=`<button class="tool-head"><svg class="caret" viewBox="0 0 12 12" style="stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round"><path d="m4.5 3 3 3-3 3"/></svg><span class="tt">3 tool calls</span><span class="t-status">running</span></button><div class="tool-body"><pre style="font-family:var(--mono);font-size:11px;color:var(--ink2)">→ read src/server/spawn.lua
→ edit spawn.lua, config.lua
→ run tests --filter spawn</pre></div>`;
    tc.querySelector(".tool-head").onclick=()=>tc.classList.toggle("open");
    body.appendChild(tc);canvasEl.scrollTop=canvasEl.scrollHeight;
  },1400));
  runTimers.push(setTimeout(()=>{
    $("#rb-txt").textContent="Running test suite 24/24…";
    const tc=am.querySelector(".tool");if(tc){tc.classList.add("done");tc.classList.remove("open");tc.querySelector(".t-status").textContent="completed";}
  },3200));
  runTimers.push(setTimeout(()=>{
    aorb.set("composing");orb.set("composing");setHud("composing");$("#rb-txt").textContent="Composing response…";
    const p=document.createElement("div");p.className="a-body";const span=document.createElement("p");p.appendChild(span);body.appendChild(p);
    const full="Done — the pads are now placed on the arena axis with a 12-stud gap, and the plinth exclusion zone is enforced before anchoring. I also added a regression spec so the two-pad layout can't silently return. The diff is in the tray above; open the Diff tab in the browser sheet for the full +383 −4 view.";
    let i=0;const iv=setInterval(()=>{span.textContent=full.slice(0,i+=3);canvasEl.scrollTop=canvasEl.scrollHeight;
      if(i>=full.length){clearInterval(iv);finishRun(orb,aorb,body);}},18);
    runTimers.push(iv);
  },4200));
}
function finishRun(orb,aorb,body){
  orb.set("idle");aorb.set("idle");setHud("idle","Done");
  app.running=false;
  $("#runbar").style.display="none";$("#c-inner").style.display="block";
  body.appendChild(diffCard());
  body.appendChild(approvalCard({id:"ap-live",title:"Apply 3 file edits",desc:"Working-tree only patch. Re-run the suite after approval.",state:"pending"}));
  canvasEl.scrollTop=canvasEl.scrollHeight;
}
function stopRun(){
  runTimers.forEach(t=>{clearTimeout(t);clearInterval(t);});runTimers=[];
  app.running=false;setHud("blocked","Stopped");
  $("#runbar").style.display="none";$("#c-inner").style.display="block";
  const doc=$("#room-stream")||$("#doc");

function palAll(q){

function openPal(){
  app.palette=true;palSel=0;
  $("#pal-veil").classList.add("open");$("#palette").classList.add("open");

  renderPal("");

function closePal(){
  app.palette=false;
  $("#pal-veil").classList.remove("open");$("#palette").classList.remove("open");
}
function renderPal(q){
  palItems=palAll(q.toLowerCase());
  const l=$("#pal-list");l.innerHTML="";
  let lastSec="";
  palItems.forEach((it,i)=>{
    if(it.sec!==lastSec){lastSec=it.sec;const s=document.createElement("div");s.className="pal-sec";s.textContent=it.sec;l.appendChild(s);}
    const b=document.createElement("button");b.className="pal-it"+(i===palSel?" sel":"");

    b.onclick=()=>{closePal();it.run();};
    b.onmouseenter=()=>{palSel=i;renderPal($("#pal-input").value);};
    l.appendChild(b);
  });
  const sel=l.children[[...l.children].findIndex(c=>c.classList.contains("sel"))];
  if(sel)sel.scrollIntoView({block:"nearest"});
}
$("#btn-pal").onclick=openPal;
$("#pal-veil").onclick=closePal;
$("#pal-input").addEventListener("input",e=>{palSel=0;renderPal(e.target.value);});
$("#pal-input").addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"){e.preventDefault();palSel=Math.min(palItems.length-1,palSel+1);renderPal(e.target.value);}
  else if(e.key==="ArrowUp"){e.preventDefault();palSel=Math.max(0,palSel-1);renderPal(e.target.value);}
  else if(e.key==="Enter"){const it=palItems[palSel];if(it){closePal();it.run();}}
});
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();app.palette?closePal():openPal();}
  if(e.key==="Escape"){if(app.palette)closePal();else if(app.drawer)toggleDrawer(false);}
});

let curFile="spawn.lua";
function hlLine(line){
  let comment="";
  const ci=line.indexOf("--");
  if(ci>=0){comment=line.slice(ci);line=line.slice(0,ci);}
  const strings=[];
  let code=line.replace(/"([^"\n]*)"/g,m=>{strings.push(m);return "\u0003\u0004";});
  code=esc(code);
  code=code.replace(/\b(\d+(?:\.\d+)?)\b/g,'<span class="tk-n">$1</span>');
  code=code.replace(/\b(local|function|end|if|then|else|elseif|for|in|do|return|true|false|nil|and|or|not|while|require)\b/g,'<span class="tk-k">$1</span>');
  code=code.replace(/\b(Instance|Vector3|game|workspace|RunService|Players|GetService|GetPivot|new|describe|it|expect)\b/g,'<span class="tk-f">$1</span>');
  let si=0;
  code=code.replace(/\u0003\u0004/g,()=>'<span class="tk-s">'+esc(strings[si++])+'</span>');
  return code+(comment?'<span class="tk-c">'+esc(comment)+'</span>':"");
}
function hl(src){return src.split("\n").map(hlLine).join("\n");}

function togglePinNote(st,p){
  const ex=st.querySelector(".pin-note");if(ex){ex.remove();return;}
  const n=document.createElement("div");n.className="pin-note";n.style.left=p.x+"%";n.style.top=p.y+"%";
  n.innerHTML=`<textarea rows="2" placeholder="Pin note…">${esc(p.note||"")}</textarea>`;
  const ta=n.querySelector("textarea");
  ta.onkeydown=e=>{if(e.key==="Enter"){p.note=ta.value;n.remove();}};
  n.onclick=e=>e.stopPropagation();
  st.appendChild(n);ta.focus();
}
/* --- 3d monolith --- */
let r3={rx:-0.35,ry:0.6,drag:false};
function render3D(v){
  const st=document.createElement("div");st.className="stage3d";
  const cv=document.createElement("canvas");st.appendChild(cv);
  st.innerHTML+=`<div class="s3d-hud"><span class="s3d-chip">monolith.glb</span><span class="s3d-chip">drag to orbit</span></div>`;
  v.appendChild(st);
  const pins3=[[0,1.62,0],[1.02,0,0.62],[-1.02,-1.55,-0.62]];
  const pinEls=pins3.map((p,i)=>{const e=document.createElement("span");e.className="s3d-pin";e.textContent=i+1;st.appendChild(e);return e;});
  const dpr=Math.min(2,devicePixelRatio||1);
  let W,H;
  const fit=()=>{W=st.clientWidth;H=st.clientHeight;cv.width=W*dpr;cv.height=H*dpr;};
  fit();
  const V=[],E=[];
  const box=(cx,cy,cz,w,h,d)=>{const s=V.length;
    for(const[x,y,z]of[[-w/2,-h/2,-d/2],[w/2,-h/2,-d/2],[w/2,h/2,-d/2],[-w/2,h/2,-d/2],[-w/2,-h/2,d/2],[w/2,-h/2,d/2],[w/2,h/2,d/2],[-w/2,h/2,d/2]])
      V.push([x+cx,y+cy,z+cz]);
    E.push([s,s+1],[s+1,s+2],[s+2,s+3],[s+3,s],[s+4,s+5],[s+5,s+6],[s+6,s+7],[s+7,s+4],[s,s+4],[s+1,s+5],[s+2,s+6],[s+3,s+7]);};
  box(0,-0.4,0,1.3,2.9,0.9);
  box(0,1.18,0,1.5,0.28,1.05);
  box(0,-1.95,0,1.9,0.22,1.3);
  const ctx=cv.getContext("2d");
  let auto=true;
  const proj=([x,y,z])=>{
    const cy=Math.cos(r3.ry),sy=Math.sin(r3.ry),cx2=Math.cos(r3.rx),sx=Math.sin(r3.rx);
    let X=x*cy+z*sy,Z=-x*sy+z*cy,Y=y*cx2-Z*sx;Z=y*sx+Z*cx2;
    const f=3.4/(3.4+Z*.9);
    return [W/2+X*H*.16*f,H*.52-Y*H*.16*f,f,Z];
  };
  st.addEventListener("mousedown",e=>{r3.drag=true;auto=false;r3.lx=e.clientX;r3.ly=e.clientY;});
  window.addEventListener("mouseup",()=>r3.drag=false);
  st.addEventListener("mousemove",e=>{if(!r3.drag)return;r3.ry+=(e.clientX-r3.lx)*.008;r3.rx+=(e.clientY-r3.ly)*.008;r3.rx=Math.max(-1.2,Math.min(1.2,r3.rx));r3.lx=e.clientX;r3.ly=e.clientY;draw();});
  function draw(){
    fit();
    ctx.clearRect(0,0,cv.width,cv.height);ctx.scale(dpr,dpr);
    ctx.strokeStyle="#e5e5e5";ctx.lineWidth=1;
    for(let g=-4;g<=4;g++){
      const a=proj([g*.8,-2.06,-3.2]),b=proj([g*.8,-2.06,3.2]);
      ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();
      const c2=proj([-3.2,-2.06,g*.8]),d2=proj([3.2,-2.06,g*.8]);
      ctx.beginPath();ctx.moveTo(c2[0],c2[1]);ctx.lineTo(d2[0],d2[1]);ctx.stroke();
    }
    ctx.strokeStyle="#3a3a3d";ctx.lineWidth=1.2;
    E.forEach(([a,b])=>{const A=proj(V[a]),B=proj(V[b]);
      ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke();});
    pins3.forEach((p,i)=>{const P=proj(p);pinEls[i].style.left=P[0]+"px";pinEls[i].style.top=P[1]+"px";pinEls[i].style.opacity=P[3]<0.35?".35":"1";});
    ctx.setTransform(1,0,0,1,0,0);
  }
  let live=true;
  const spin=()=>{if(!live)return;if(auto&&!reduceMotion&&!document.hidden){r3.ry+=.004;draw();}requestAnimationFrame(spin);};
  draw();spin();
  const ro=new MutationObserver(()=>{if(!document.contains(st)){live=false;ro.disconnect();}});
  ro.observe(document.body,{childList:true,subtree:true});
}
