<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<title>chatbar-07 â€” Adaptive Approval, Diff &amp; Steer Bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#ffffff; --surface:#fafafa; --subtle:#f5f5f5; --hover:#f2f2f3; --active:#eaeaec;
    --bd:#ebebeb; --bd-strong:#dcdce0;
    --ink:#171717; --ink2:#525252; --mut:#8a8a8a; --faint:#a8a8a8;
    --ok:#166534; --ok-bg:#f0fdf4; --ok-bd:#dcfce7;
    --info:#1d4ed8; --info-bg:#f2f6fa; --info-bd:#d7e4f0;
    --warn:#b45309; --warn-acc:#d97706; --warn-bg:#fffbeb; --warn-bd:#fde68a;
    --danger:#b91c1c; --danger-bg:#fef2f2; --danger-bd:#fecaca;
    --sans:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;
    --elev:0 1px 2px rgba(0,0,0,.04),0 8px 24px -6px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  body{display:flex;flex-direction:column;overflow:hidden}
  button{font-family:inherit;cursor:pointer}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

  /* ---------- simulator bar ---------- */
  .simbar{height:46px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:14px;z-index:40}
  .sim-left{display:flex;align-items:center;gap:9px;min-width:0}
  .back{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--ink2);text-decoration:none}
  .back:hover{background:var(--hover);color:var(--ink)}
  .id-chip{font-family:var(--mono);font-size:11px;color:var(--mut);background:var(--bg);border:1px solid var(--bd);padding:2px 7px;border-radius:5px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .sim-title{font-size:13px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sim-right{display:flex;align-items:center;gap:10px}
  .sim-lbl{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.09em;font-weight:500}
  .seg{display:flex;gap:2px;background:#f0f0f1;border:1px solid var(--bd);border-radius:8px;padding:2px}
  .seg button{border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 10px;font-size:12px;font-weight:500;color:var(--ink2);transition:background .15s,color .15s,border-color .15s;white-space:nowrap}
  .seg button:hover{color:var(--ink)}
  .seg button.on{background:var(--bg);color:var(--ink);border-color:var(--bd-strong)}

  /* ---------- stage ---------- */
  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:28px 24px 72px;position:relative;min-height:0}
  .hint{position:absolute;top:26px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--faint);display:flex;align-items:center;gap:7px;white-space:nowrap}
  .hint .dot{width:5px;height:5px;border-radius:50%;background:var(--bd-strong)}

  /* ---------- composer stack ---------- */
  .composer{width:min(760px,94vw)}
  .card{position:relative;background:var(--bg);border:1px solid #e5e5e5;border-radius:18px;box-shadow:var(--elev);overflow:visible}
  .card.clip{overflow:hidden}

  /* morphing dock */
  .dockwrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .34s cubic-bezier(.22,.7,.24,1)}
  .dockwrap.open{grid-template-rows:1fr}
  .dockclip{overflow:hidden;min-height:0}
  .dock{background:var(--subtle);border-bottom:1px solid var(--bd);border-radius:17px 17px 0 0;opacity:0;transition:opacity .22s ease}
  .dockwrap.open .dock{opacity:1}
  .d-row{display:flex;align-items:center;gap:9px;padding:9px 12px;min-height:44px}
  .d-ic{display:inline-flex;color:var(--ink2);flex-shrink:0}
  .d-ic.warn{color:var(--warn)}
  .d-txt{font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-width:0}
  .d-txt strong{color:var(--ink);font-weight:600}
  .d-txt code{font-family:var(--mono);font-size:11.5px;background:var(--bg);border:1px solid var(--bd);border-radius:5px;padding:1.5px 6px;color:var(--ink)}
  .wchip{font-family:var(--mono);font-size:10.5px;color:var(--mut);border:1px solid var(--bd);border-radius:5px;padding:1.5px 6px;background:var(--bg);white-space:nowrap}
  .num{font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums}
  .num.add{color:var(--ok)}
  .num.del{color:var(--danger)}
  .d-sp{flex:1}
  .d-div{width:1px;height:18px;background:var(--bd-strong);flex-shrink:0;margin:0 2px}
  .d-link{border:none;background:transparent;font-size:12px;font-weight:500;color:var(--ink2);padding:4px 8px;border-radius:6px}
  .d-link:hover{background:var(--active);color:var(--ink)}
  .d-link.primary{color:var(--info)}
  .d-link.primary:hover{background:var(--info-bg)}
  .d-x{border:none;background:transparent;color:var(--mut);width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
  .d-x:hover{background:var(--active);color:var(--ink)}
  .d-btn{border:1px solid var(--bd-strong);background:var(--bg);color:var(--ink);font-size:12px;font-weight:500;padding:4.5px 11px;border-radius:7px;white-space:nowrap;transition:background .14s,border-color .14s}
  .d-btn:hover{background:var(--hover)}
  .d-btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
  .d-btn.dark:hover{background:#2b2b2b}
  .d-btn.danger{color:var(--danger);border-color:var(--danger-bd);background:var(--bg)}
  .d-btn.danger:hover{background:var(--danger-bg)}
  .d-btn.ghost-danger{border-color:transparent;background:transparent;color:var(--danger);font-weight:500}
  .d-btn.ghost-danger:hover{background:var(--danger-bg)}
  .d-run{display:flex;flex-direction:column;gap:0;min-width:0}
  .d-title{font-size:12.5px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
  .d-step{font-size:11.5px;color:var(--mut);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px;transition:opacity .18s}
  .d-step.swap{opacity:0}
  .orb{flex-shrink:0;display:block}
  .timer{font-size:11.5px;color:var(--ink2);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:3px 8px;font-variant-numeric:tabular-nums;flex-shrink:0}
  .steered{font-size:10.5px;font-weight:500;color:var(--info);background:var(--info-bg);border:1px solid var(--info-bd);border-radius:20px;padding:2.5px 9px;animation:pop .25s ease;flex-shrink:0}
  @keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}

  /* expandable diff file list */
  .d-sub{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.22,.7,.24,1)}
  .d-sub.open{grid-template-rows:1fr}
  .d-subclip{overflow:hidden;min-height:0}
  .d-files{border-top:1px solid var(--bd);padding:7px 12px 10px;display:flex;flex-direction:column;gap:5px}
  .f-row{display:flex;align-items:center;gap:9px;font-size:11.5px}
  .f-ic{color:var(--mut);display:inline-flex;flex-shrink:0}
  .f-name{font-family:var(--mono);color:var(--ink2);font-size:11.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .f-bar{display:flex;width:64px;height:4px;border-radius:2px;overflow:hidden;background:var(--bd);flex-shrink:0}
  .f-bar i{display:block;height:100%}
  .f-bar .a{background:var(--ok)}
  .f-bar .r{background:var(--danger)}
  .f-act{display:flex;gap:8px;padding:7px 12px 10px;border-top:1px dashed var(--bd)}
  .f-act .d-link{padding:3px 7px;font-size:11.5px}

  /* attachment chips */
  .chips{display:none;flex-wrap:wrap;gap:6px;padding:10px 14px 0}
  .chips.show{display:flex}
  .chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--ink2);background:var(--subtle);border:1px solid var(--bd);border-radius:7px;padding:3.5px 6px 3.5px 8px;animation:pop .2s ease}
  .chip button{border:none;background:transparent;color:var(--mut);width:16px;height:16px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;padding:0}
  .chip button:hover{background:var(--active);color:var(--ink)}

  /* textarea */
  .ta-wrap{padding:13px 16px 4px}
  textarea{display:block;width:100%;border:none;outline:none;resize:none;background:transparent;font-family:var(--sans);font-size:14.5px;line-height:1.55;color:var(--ink);min-height:24px;max-height:150px}
  textarea::placeholder{color:var(--faint)}
  .ta-wrap.running textarea::placeholder{color:var(--warn)}

  /* bottom control row */
  .row{display:flex;align-items:center;gap:6px;padding:8px 12px 11px}
  .ic{width:30px;height:30px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--ink2);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .14s,color .14s}
  .ic:hover{background:var(--hover);color:var(--ink)}
  .ic.slash{border:1px solid var(--bd);font-family:var(--mono);font-size:12.5px;color:var(--ink2);width:28px;height:28px;border-radius:7px}
  .ic.slash:hover{background:var(--hover);color:var(--ink)}
  .pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd);background:var(--bg);border-radius:8px;padding:5px 9px;font-size:12px;font-weight:500;color:var(--ink2);white-space:nowrap;transition:background .14s,border-color .14s,color .14s}
  .pill:hover{background:var(--hover);color:var(--ink);border-color:var(--bd-strong)}
  .pill svg{flex-shrink:0}
  .pill .pv{color:var(--ink)}
  .pill .sep{color:var(--faint);font-weight:400}
  .sp{flex:1}
  .ringbtn{width:30px;height:30px;border-radius:50%;border:1px solid transparent;background:transparent;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;position:relative}
  .ringbtn:hover{background:var(--hover)}
  .send{width:32px;height:32px;border-radius:50%;border:none;background:#c9c9ca;color:#fff;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .18s,width .25s cubic-bezier(.22,.7,.24,1),border-radius .25s cubic-bezier(.22,.7,.24,1),padding .25s;font-size:12px;font-weight:600;gap:5px;overflow:hidden;white-space:nowrap}
  .send.ready{background:var(--ink)}
  .send.ready:hover{background:#2b2b2b}
  .send.steer{width:auto;border-radius:16px;padding:0 13px;background:var(--ink)}
  .send.steer:hover{background:#2b2b2b}
  .send:active{transform:scale(.94)}

  /* popovers */
  .pop{position:absolute;z-index:50;background:var(--bg);border:1px solid var(--bd);border-radius:12px;box-shadow:var(--elev);padding:5px;min-width:196px;opacity:0;transform:translateY(4px);transition:opacity .16s ease,transform .16s ease;pointer-events:none}
  .pop.open{opacity:1;transform:translateY(0);pointer-events:auto}
  .pop-h{font-size:10.5px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;padding:6px 9px 4px}
  .opt{display:flex;align-items:center;gap:8px;width:100%;border:none;background:transparent;border-radius:7px;padding:6.5px 9px;font-size:12.5px;color:var(--ink2);text-align:left;transition:background .12s,color .12s}
  .opt:hover{background:var(--hover);color:var(--ink)}
  .opt .ck{width:14px;display:inline-flex;color:var(--ink);flex-shrink:0;visibility:hidden}
  .opt.sel .ck{visibility:visible}
  .opt.sel{color:var(--ink);font-weight:500}
  .opt .desc{margin-left:auto;font-size:10.5px;color:var(--faint)}
  .opt .kbd{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--mut);background:var(--subtle);border:1px solid var(--bd);border-radius:4px;padding:1px 5px}
  .pop-div{height:1px;background:var(--bd);margin:5px 4px}
  .ctx-row{display:flex;align-items:center;justify-content:space-between;padding:5.5px 9px;font-size:12px;color:var(--ink2)}
  .ctx-row b{color:var(--ink);font-weight:500;font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums}
  .ctx-track{height:4px;border-radius:2px;background:var(--bd);margin:4px 9px 8px;overflow:hidden}
  .ctx-track i{display:block;height:100%;background:var(--warn-acc);border-radius:2px;transition:width .4s}

  /* toast */
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);background:var(--ink);color:#fff;font-size:12px;font-weight:500;padding:8px 14px;border-radius:9px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:99;box-shadow:var(--elev)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:720px){
    .sim-title{display:none}
    .seg button{padding:4px 7px;font-size:11px}
    .d-step{max-width:160px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01ms!important;animation-duration:.01ms!important}
  }
</style>
</head>

      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg>

        </button>

</main>

<script>
"use strict";
const $ = s => document.querySelector(s);

const I = {
  x:'<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>',
  check:'<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.7 6.6 11.7 12.6 4.8"/></svg>',
  pencil:'<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.7 3.6 12.4 6.3 6 12.7l-3.5.8.8-3.5z"/><path d="M8.9 4.4l2.7 2.7"/></svg>',
  shield:'<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.2 12.6 4v3.6c0 3-1.9 5.1-4.6 6.2C5.3 12.7 3.4 10.6 3.4 7.6V4z"/><path d="M6.1 8.1l1.3 1.3 2.5-2.7"/></svg>',
  file:'<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.2 2.6h4.6l3 3v7.8H4.2z"/><path d="M8.8 2.6v3h3"/></svg>',
  arrow:'<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12.8V3.2M4.3 6.7 8 3l3.7 3.7"/></svg>'
};

/* ---------------------------------------------------------------- orb */
function makeOrb(canvas, size){
  size = size || 24;
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = size * dpr; canvas.height = size * dpr;
  canvas.style.width = size + 'px'; canvas.style.height = size + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const N = 46, dots = [];
  for (let i = 0; i < N; i++){
    const y = 1 - (i / (N - 1)) * 2;
    const r = Math.sqrt(Math.max(0, 1 - y * y));
    const th = i * 2.399963;
    dots.push({ x: Math.cos(th) * r, y, z: Math.sin(th) * r });
  }
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let level = 0, target = 0, t = Math.random() * 20, raf = null;
  function draw(){
    ctx.clearRect(0, 0, size, size);
    const cx = size / 2, cy = size / 2, R = size * 0.335;
    ctx.beginPath(); ctx.arc(cx, cy, size * 0.46, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(23,23,23,' + (0.10 + 0.08 * level).toFixed(3) + ')';
    ctx.lineWidth = 1; ctx.stroke();
    const breath = 1 + Math.sin(t * 1.15) * 0.055 * level;
    const rot = t * (0.35 + 0.75 * level);
    const cR = Math.cos(rot), sR = Math.sin(rot);
    for (const d of dots){
      const x0 = d.x * cR - d.z * sR;
      const z0 = d.x * sR + d.z * cR;
      const depth = (z0 + 1) / 2;
      const a = (0.05 + depth * 0.5) * (0.22 + 0.78 * level) + 0.02;
      const rr = 0.5 + depth * 1.0;
      ctx.beginPath(); ctx.arc(cx + x0 * R * breath, cy + d.y * R * breath, rr, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(23,23,23,' + Math.min(a, 0.6).toFixed(3) + ')'; ctx.fill();
    }
  }
  function frame(){
    t += 0.016; level += (target - level) * 0.09; draw();
    if (target > 0.001 || level > 0.02) raf = requestAnimationFrame(frame); else raf = null;
  }
  function kick(){ if (reduced){ level = target; draw(); return; } if (!raf) raf = requestAnimationFrame(frame); }
  draw();
  return { set(v){ target = v; kick(); }, destroy(){ if (raf) cancelAnimationFrame(raf); raf = null; } };
}

/* ---------------------------------------------------------------- state */
const STEPS = [
  'Reading src/harness/state.ts',
  'Searching variants/index.html',
  'Editing chatbars/chatbar-07.html',
  'Running bun test tests',
  'Composing diff  +383 âˆ’4'
];
let mode = 'idle', paused = false;
let elapsed = 0, timerInt = null, stepInt = null, tokInt = null;
let stepIdx = 0, tokens = 0, ctxPct = 38;
let curOrb = null, curPop = null;
let model = 'SWE-2 High', effort = 'High', autonomy = 'Medium', folder = 'wt-052c59c7';

const dockwrap = $('#dockwrap'), dock = $('#dock'), card = $('#card');
const ta = $('#ta'), tawrap = $('#tawrap'), sendBtn = $('#send');
const chips = $('#chips'), toastEl = $('#toast');
const running = () => mode === 'thinking' || mode === 'streaming';

/* ---------------------------------------------------------------- toast */
let toastT = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

/* ---------------------------------------------------------------- popovers */
function closePop(){ if (curPop){ curPop.remove(); curPop = null; } }
function openPop(anchor, html, opts){
  opts = opts || {};
  const prev = curPop && curPop.dataset.anchor;
  closePop();
  if (prev && prev === (opts.anchor || '')) return null;
  const pop = document.createElement('div');
  pop.className = 'pop'; pop.innerHTML = html;
  pop.dataset.anchor = opts.anchor || '';
  card.appendChild(pop);
  const cR = card.getBoundingClientRect(), aR = anchor.getBoundingClientRect();
  pop.style.bottom = (cR.bottom - aR.top + 8) + 'px';
  if (opts.right) pop.style.right = Math.max(8, cR.right - aR.right) + 'px';
  else pop.style.left = Math.min(Math.max(8, aR.left - cR.left), cR.width - 210) + 'px';
  if (opts.width) pop.style.width = opts.width + 'px';
  requestAnimationFrame(() => pop.classList.add('open'));
  curPop = pop;
  return pop;
}
function optRow(label, sel, data, desc){
  return '<button class="opt' + (sel ? ' sel' : '') + '" ' + data + '><span class="ck">' + I.check + '</span>' + label + (desc ? '<span class="desc">' + desc + '</span>' : '') + '</button>';
}
document.addEventListener('click', e => {
  if (curPop && !curPop.contains(e.target) && !e.target.closest('.pill,.ic,.ringbtn')) closePop();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePop(); });

/* ---------------------------------------------------------------- dock templates */
function fileRow(name, a, d){
  const tot = a + d, aw = Math.round(a / tot * 100);
  return '<div class="f-row"><span class="f-ic">' + I.file + '</span><span class="f-name">' + name + '</span>' +
    '<span class="num add">+' + a + '</span><span class="num del">âˆ’' + d + '</span>' +
    '<span class="f-bar"><i class="a" style="width:' + aw + '%"></i><i class="r" style="width:' + (100 - aw) + '%"></i></span></div>';
}
function dockDiff(){
  return '<div class="d-row"><span class="d-ic">' + I.pencil + '</span>' +
    '<span class="d-txt"><strong>3 files changed</strong><span class="num add">+383</span><span class="num del">âˆ’4</span></span><span class="d-sp"></span>' +
    '<button class="d-link" data-act="quick">Quick review</button>' +
    '<button class="d-link primary" data-act="view">View changes</button>' +
    '<button class="d-x" data-act="dismiss" aria-label="Dismiss">' + I.x + '</button></div>' +
    '<div class="d-sub" id="dsub"><div class="d-subclip"><div class="d-files">' +
      fileRow('src/harness/state.ts', 212, 3) +
      fileRow('system/harness/variants/chatbars/chatbar-07.html', 154, 1) +

}
function dockApproval(){
  return '<div class="d-row"><span class="d-ic warn">' + I.shield + '</span>' +
    '<span class="d-txt"><strong>Approval needed</strong><code>Run: bun test tests</code><span class="wchip">in wt-052c59c7</span></span><span class="d-sp"></span>' +
    '<button class="d-btn" data-act="once">Allow once</button>' +
    '<button class="d-btn" data-act="session">Allow session</button>' +
    '<button class="d-btn danger" data-act="deny">Deny</button></div>';
}
function dockRun(){
  const streaming = mode === 'streaming';
  return '<div class="d-row"><canvas class="orb" id="orb"></canvas>' +
    '<div class="d-run"><span class="d-title" id="dtitle">' + (streaming ? 'Streaming' : 'Thinking') + '</span>' +
    '<span class="d-step" id="dstep">' + (streaming ? 'Composing response â€” 0 tokens' : STEPS[0]) + '</span></div>' +
    '<span class="steered" id="steered" hidden>Steer queued</span><span class="d-sp"></span>' +
    '<span class="timer mono" id="dtimer">' + fmt(elapsed) + '</span>' +
    '<button class="d-btn" data-act="pause" id="pausebtn">' + (paused ? 'Resume' : 'Pause') + '</button>' +
    '<span class="d-div"></span>' +
    '<button class="d-btn ghost-danger" data-act="stop">Stop</button></div>';
}

/* ---------------------------------------------------------------- dock actions */
function bindDock(){
  dock.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => {
    const a = b.dataset.act;
    if (a === 'dismiss'){ setMode('idle'); toast('Diff tray dismissed'); }
    else if (a === 'quick'){ const sub = $('#dsub'); if (sub) sub.classList.toggle('open'); }
    else if (a === 'view'){ const sub = $('#dsub'); if (sub) sub.classList.add('open'); }
    else if (a === 'apply'){ toast('Changes applied to worktree wt-052c59c7'); setMode('idle'); }
    else if (a === 'revert'){ toast('Diff reverted'); setMode('idle'); }
    else if (a === 'once'){ toast('Allowed once â€” resuming'); setMode('thinking'); }
    else if (a === 'session'){ toast('Allowed for this session'); setMode('thinking'); }
    else if (a === 'deny'){ toast('Command denied'); setMode('idle'); }
    else if (a === 'pause'){ togglePause(); }
    else if (a === 'stop'){ setMode('idle'); toast('Agent stopped'); }
  }));
}

/* ---------------------------------------------------------------- timers */
function fmt(s){ return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function clearTimers(){ [timerInt, stepInt, tokInt].forEach(i => i && clearInterval(i)); timerInt = stepInt = tokInt = null; }
function startTimers(){
  clearTimers();
  timerInt = setInterval(() => {
    if (paused) return;
    elapsed++;
    const el = $('#dtimer'); if (el) el.textContent = fmt(elapsed);
  }, 1000);
  if (mode === 'thinking'){
    stepInt = setInterval(() => {
      if (paused) return;
      stepIdx = (stepIdx + 1) % STEPS.length;
      const el = $('#dstep'); if (!el) return;
      el.classList.add('swap');
      setTimeout(() => { el.textContent = STEPS[stepIdx]; el.classList.remove('swap'); }, 180);
    }, 2600);
  }
  if (mode === 'streaming'){
    tokInt = setInterval(() => {
      if (paused) return;
      tokens += 7 + Math.floor(Math.random() * 14);
      const el = $('#dstep'); if (el) el.textContent = 'Composing response â€” ' + tokens + ' tokens';
      if (Math.random() < 0.28){ ctxPct = Math.min(62, ctxPct + 1); drawRing(); }
    }, 420);
  }
}
function togglePause(){
  paused = !paused;
  const pb = $('#pausebtn'); if (pb) pb.textContent = paused ? 'Resume' : 'Pause';
  const st = $('#dstep');
  if (paused && st){ st.dataset.prev = st.textContent; st.textContent = 'Paused â€” output held'; }
  else if (st && st.dataset.prev){ st.textContent = st.dataset.prev; delete st.dataset.prev; }
  if (curOrb) curOrb.set(paused ? 0.18 : 1);
  toast(paused ? 'Agent paused' : 'Agent resumed');
}

/* ---------------------------------------------------------------- mode */
function setMode(m){
  mode = m; paused = false; stepIdx = 0; tokens = 0;
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  closePop();
  if (curOrb){ curOrb.destroy(); curOrb = null; }

  if (m === 'idle'){
    dockwrap.classList.remove('open');
    dock.innerHTML = '';
    clearTimers(); elapsed = 0;
  } else {
    dock.innerHTML = m === 'diff' ? dockDiff() : m === 'approval' ? dockApproval() : dockRun();
    dockwrap.classList.add('open');
    bindDock();
    if (running()){
      const c = $('#orb'); if (c){ curOrb = makeOrb(c, 24); curOrb.set(1); }
      startTimers();
    } else {
      clearTimers();
    }
  }

  /* composer morph â†’ steer */
  const isRun = running();
  tawrap.classList.toggle('running', isRun);
  ta.placeholder = isRun ? 'Steer â†’ PM â€” send guidance while the agent worksâ€¦' : 'Message the agent â€” / for commands';
  if (isRun){
    sendBtn.classList.add('steer', 'ready');
    sendBtn.innerHTML = '<span>Steer</span>' + I.arrow;
    sendBtn.setAttribute('aria-label', 'Steer the agent');
  } else {
    sendBtn.classList.remove('steer');
    sendBtn.innerHTML = I.arrow.replace('width="14" height="14"', 'width="15" height="15"');
    sendBtn.setAttribute('aria-label', 'Send');
    syncSend();
  }
}
function syncSend(){ if (!sendBtn.classList.contains('steer')) sendBtn.classList.toggle('ready', ta.value.trim().length > 0); }

/* ---------------------------------------------------------------- ring */
function drawRing(){
  const arc = $('#ring-arc');
  const C = 56.55;
  arc.style.strokeDashoffset = (C * (1 - ctxPct / 100)).toFixed(2);
}

/* ---------------------------------------------------------------- textarea */
function autosize(){ ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 150) + 'px'; }
ta.addEventListener('input', () => { autosize(); syncSend(); slashWatch(); });
ta.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); doSend(); }
});
function doSend(){
  const v = ta.value.trim();
  if (!v) return;
  ta.value = ''; autosize(); syncSend();
  if (running()){
    const s = $('#steered');
    if (s){ s.hidden = false; setTimeout(() => { s.hidden = true; }, 2400); }
    toast('Steered â†’ PM: â€œ' + (v.length > 46 ? v.slice(0, 46) + 'â€¦' : v) + 'â€');
  } else {
    toast('Message sent â€” agent started');
    setMode('thinking');
  }
}
sendBtn.addEventListener('click', doSend);

/* ---------------------------------------------------------------- slash menu */
const SLASH = [
  ['/plan',   'Switch to planning mode'],
  ['/tests',  'Run test suite'],
  ['/review', 'Request code review'],
  ['/diff',   'Show pending diff'],
  ['/steer',  'Steer the running agent'],
  ['/compact','Compact context window']
];
function slashHtml(items){
  return '<div class="pop-h">Commands</div>' + items.map(s =>
    '<button class="opt" data-cmd="' + s[0] + '"><span style="font-family:var(--mono);font-size:11.5px;color:var(--ink)">' + s[0] + '</span><span class="desc">' + s[1] + '</span></button>'
  ).join('');
}
function bindSlash(pop){
  pop.querySelectorAll('[data-cmd]').forEach(b => b.addEventListener('click', () => {
    ta.value = ''; autosize(); syncSend(); closePop(); ta.focus();
    toast(b.dataset.cmd + ' â€” ' + SLASH.find(x => x[0] === b.dataset.cmd)[1].toLowerCase());
    if (b.dataset.cmd === '/diff') setMode('diff');
    if (b.dataset.cmd === '/steer' && !running()) setMode('thinking');
  }));
}
function slashWatch(){
  const v = ta.value;
  if (/^\/\w*$/.test(v)){
    const q = v.slice(1).toLowerCase();
    const items = SLASH.filter(s => s[0].slice(1).startsWith(q));
    if (!items.length){ closePop(); return; }
    if (curPop && curPop.dataset.anchor === 'slash'){ curPop.innerHTML = slashHtml(items); bindSlash(curPop); return; }
    const pop = openPop($('#btn-slash'), slashHtml(items), { width: 236, anchor: 'slash' });
    if (pop) bindSlash(pop);
  } else if (curPop && curPop.dataset.anchor === 'slash') closePop();
}
$('#btn-slash').addEventListener('click', () => {
  if (curPop && curPop.dataset.anchor === 'slash'){ closePop(); ta.value = ''; autosize(); syncSend(); return; }
  closePop();
  ta.value = '/'; autosize(); syncSend(); ta.focus(); slashWatch();
});
