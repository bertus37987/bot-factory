<head>

<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<title>chatbar-08 â€” Swiss Editorial Minimal Line Composer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#ffffff; --surface:#fafafa; --subtle:#f5f5f5; --hover:#f2f2f3; --active:#eaeaec;
    --bd:#ebebeb; --bd-strong:#dcdce0;
    --ink:#171717; --ink2:#525252; --mut:#8a8a8a; --faint:#a8a8a8;
    --ok:#166534;
    --info:#1d4ed8; --info-bg:#f2f6fa; --info-bd:#d7e4f0;
    --warn:#b45309;
    --danger:#b91c1c;
    --sans:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;
    --elev:0 1px 2px rgba(0,0,0,.04),0 8px 24px -6px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  body{display:flex;flex-direction:column;overflow:hidden}
  button{font-family:inherit;cursor:pointer}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

  /* ---------- simulator bar ---------- */
  .simbar{height:46px;flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:14px;z-index:40}
  .sim-left{display:flex;align-items:center;gap:9px;min-width:0}
  .back{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--ink2);text-decoration:none}
  .back:hover{background:var(--hover);color:var(--ink)}
  .id-chip{font-family:var(--mono);font-size:11px;color:var(--mut);background:var(--bg);border:1px solid var(--bd);padding:2px 7px;border-radius:5px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .sim-title{font-size:13px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sim-right{display:flex;align-items:center;gap:10px}
  .sim-lbl{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.09em;font-weight:500}
  .seg{display:flex;gap:2px;background:#f0f0f1;border:1px solid var(--bd);border-radius:8px;padding:2px}
  .seg button{border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 10px;font-size:12px;font-weight:500;color:var(--ink2);transition:background .15s,color .15s,border-color .15s;white-space:nowrap}
  .seg button:hover{color:var(--ink)}
  .seg button.on{background:var(--bg);color:var(--ink);border-color:var(--bd-strong)}

  /* ---------- stage ---------- */
  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 24px;position:relative;min-height:0;gap:14px}
  .hint{position:absolute;top:26px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--faint);display:flex;align-items:center;gap:7px;white-space:nowrap}
  .hint .dot{width:5px;height:5px;border-radius:50%;background:var(--bd-strong)}

  .kicker{width:min(680px,94vw);display:flex;align-items:baseline;justify-content:space-between}
  .kicker .k-l{font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
  .kicker .k-r{font-family:var(--mono);font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}

  /* ---------- the sheet ---------- */
  .sheet{position:relative;width:min(680px,94vw);background:var(--surface);border:1px solid var(--bd);border-radius:12px;box-shadow:var(--elev)}

  /* status strip â€” appears only in non-idle states */
  .statuswrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .34s cubic-bezier(.22,.7,.24,1)}
  .statuswrap.open{grid-template-rows:1fr}
  .statusclip{overflow:hidden;min-height:0}
  .status{border-bottom:1px solid var(--bd);opacity:0;transition:opacity .22s ease}
  .statuswrap.open .status{opacity:1}
  .s-row{display:flex;align-items:center;gap:8px;padding:9px 16px;min-height:38px;font-size:12px;color:var(--ink2)}
  .s-tag{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);flex-shrink:0}
  .s-tag.warn{color:var(--warn)}
  .s-txt{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .s-txt code{font-family:var(--mono);font-size:11px;color:var(--ink)}
  .s-num{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums}
  .s-num.add{color:var(--ok)} .s-num.del{color:var(--danger)}
  .s-mid{color:var(--faint)}
  .s-sp{flex:1}
  .s-time{font-family:var(--mono);font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums;flex-shrink:0}
  .tbtn{border:none;background:transparent;padding:3px 4px;font-size:12px;font-weight:500;color:var(--ink2);border-radius:5px;position:relative}
  .tbtn:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
  .tbtn.danger{color:var(--danger)}
  .tbtn.danger:hover{color:var(--danger)}
  .steered{font-size:10.5px;font-weight:500;color:var(--info);background:var(--info-bg);border:1px solid var(--info-bd);border-radius:20px;padding:2px 9px;animation:pop .25s ease;flex-shrink:0}
  @keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}

  .s-sub{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.22,.7,.24,1)}
  .s-sub.open{grid-template-rows:1fr}
  .s-subclip{overflow:hidden;min-height:0}
  .s-files{border-top:1px solid var(--bd);padding:7px 16px 10px;display:flex;flex-direction:column;gap:4px}
  .s-file{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;color:var(--ink2)}
  .s-file .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* writing area */
  .write{padding:20px 22px 4px}
  textarea{display:block;width:100%;border:none;outline:none;resize:none;background:transparent;font-family:var(--sans);font-size:15.5px;line-height:1.62;letter-spacing:-.005em;color:var(--ink);min-height:96px;max-height:200px}
  textarea::placeholder{color:var(--faint)}
  .write.running textarea::placeholder{color:var(--mut)}

  /* metadata line */
  .metabar{display:flex;align-items:center;gap:7px;padding:9px 14px 12px 16px}
  .orb{flex-shrink:0;display:block;margin-right:2px}
  .meta{display:flex;align-items:center;min-width:0;flex-wrap:nowrap;overflow:hidden}
  .meta i{font-style:normal;color:var(--faint);padding:0 7px;user-select:none;font-size:11px}
  .meta button{border:none;background:transparent;padding:3px 5px;border-radius:5px;font-size:12px;font-weight:500;color:var(--ink2);white-space:nowrap;display:inline-flex;align-items:center;gap:5px;transition:color .13s,background .13s}
  .meta button:hover{color:var(--ink);background:var(--hover)}
  .meta button{position:relative}
  .meta button.open{color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--bd-strong)}
  .sp{flex:1}
  .send{width:32px;height:32px;border-radius:50%;border:none;background:#c9c9ca;color:#fff;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .18s}
  .send.ready{background:var(--ink)}
  .send.ready:hover{background:#2b2b2b}
  .send:active{transform:scale(.93)}

  /* micro popovers */
  .pop{position:absolute;z-index:50;background:var(--bg);border:1px solid var(--bd);border-radius:11px;box-shadow:var(--elev);padding:5px;min-width:184px;opacity:0;transform:translateY(4px);transition:opacity .16s ease,transform .16s ease;pointer-events:none}
  .pop.open{opacity:1;transform:translateY(0);pointer-events:auto}
  .pop-h{font-size:10px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.09em;padding:6px 9px 4px}
  .opt{display:flex;align-items:center;gap:8px;width:100%;border:none;background:transparent;border-radius:7px;padding:6px 9px;font-size:12.5px;color:var(--ink2);text-align:left;transition:background .12s,color .12s}
  .opt:hover{background:var(--hover);color:var(--ink)}
  .opt .ck{width:14px;display:inline-flex;color:var(--ink);flex-shrink:0;visibility:hidden}
  .opt.sel .ck{visibility:visible}
  .opt.sel{color:var(--ink);font-weight:500}
  .opt .desc{margin-left:auto;font-size:10.5px;color:var(--faint)}
  .pop-div{height:1px;background:var(--bd);margin:5px 4px}
  .ctx-row{display:flex;align-items:center;justify-content:space-between;padding:5px 9px;font-size:12px;color:var(--ink2)}
  .ctx-row b{color:var(--ink);font-weight:500;font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums}
  .ctx-track{height:3px;border-radius:2px;background:var(--bd);margin:4px 9px 8px;overflow:hidden}
  .ctx-track i{display:block;height:100%;background:var(--ink);border-radius:2px;transition:width .4s}

  /* toast */
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);background:var(--ink);color:#fff;font-size:12px;font-weight:500;padding:8px 14px;border-radius:9px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:99;box-shadow:var(--elev)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:720px){
    .sim-title{display:none}
    .seg button{padding:4px 7px;font-size:11px}
    .meta i{padding:0 4px}
    .s-txt{max-width:160px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01ms!important;animation-duration:.01ms!important}
  }
</style>
</head>
<body>

<header class="simbar">
  <div class="sim-left">

      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg>

      </nav>

<script>
"use strict";
const $ = s => document.querySelector(s);

const I = {
  check:'<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.7 6.6 11.7 12.6 4.8"/></svg>'
};

/* ---------------------------------------------------------------- orb */
function makeOrb(canvas, size){
  size = size || 17;
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = size * dpr; canvas.height = size * dpr;
  canvas.style.width = size + 'px'; canvas.style.height = size + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const N = 34, dots = [];
  for (let i = 0; i < N; i++){
    const y = 1 - (i / (N - 1)) * 2;
    const r = Math.sqrt(Math.max(0, 1 - y * y));
    const th = i * 2.399963;
    dots.push({ x: Math.cos(th) * r, y, z: Math.sin(th) * r });
  }
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let level = 0, target = 0, t = Math.random() * 20, raf = null;
  function draw(){
    ctx.clearRect(0, 0, size, size);
    const cx = size / 2, cy = size / 2, R = size * 0.33;
    ctx.beginPath(); ctx.arc(cx, cy, size * 0.45, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(23,23,23,' + (0.10 + 0.08 * level).toFixed(3) + ')';
    ctx.lineWidth = 0.8; ctx.stroke();
    const breath = 1 + Math.sin(t * 1.15) * 0.06 * level;
    const rot = t * (0.35 + 0.75 * level);
    const cR = Math.cos(rot), sR = Math.sin(rot);
    for (const d of dots){
      const x0 = d.x * cR - d.z * sR;
      const z0 = d.x * sR + d.z * cR;
      const depth = (z0 + 1) / 2;
      const a = (0.05 + depth * 0.5) * (0.22 + 0.78 * level) + 0.02;
      const rr = 0.35 + depth * 0.75;
      ctx.beginPath(); ctx.arc(cx + x0 * R * breath, cy + d.y * R * breath, rr, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(23,23,23,' + Math.min(a, 0.6).toFixed(3) + ')'; ctx.fill();
    }
  }
  function frame(){
    t += 0.016; level += (target - level) * 0.09; draw();
    if (target > 0.001 || level > 0.02) raf = requestAnimationFrame(frame); else raf = null;
  }
  function kick(){ if (reduced){ level = target; draw(); return; } if (!raf) raf = requestAnimationFrame(frame); }
  draw();
  return { set(v){ target = v; kick(); } };
}

/* ---------------------------------------------------------------- state */
const STEPS = [
  'Reading src/harness/state.ts',
  'Searching variants/index.html',
  'Editing chatbars/chatbar-08.html',
  'Running bun test tests',
  'Composing diff  +383 âˆ’4'
];
let mode = 'idle', paused = false;
let elapsed = 0, timerInt = null, stepInt = null, tokInt = null;
let stepIdx = 0, tokens = 0, ctxPct = 38, curPop = null;
let model = 'SWE-2 High', effort = 'Medium', autonomy = 'Scoped', project = 'wt-052c59c7';

const sheet = $('#sheet'), statuswrap = $('#statuswrap'), status = $('#status');
const write = $('#write'), ta = $('#ta'), sendBtn = $('#send'), toastEl = $('#toast');
const orb = makeOrb($('#orb'), 17);
const running = () => mode === 'thinking' || mode === 'streaming';

let toastT = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

/* ---------------------------------------------------------------- popovers */
function closePop(){
  if (curPop){ curPop.remove(); curPop = null; }
  document.querySelectorAll('.meta button.open').forEach(b => b.classList.remove('open'));
}
function openPop(anchor, html, opts){
  opts = opts || {};
  const was = curPop; closePop();
  if (was && was.dataset.anchor === anchor.dataset.seg) return null;
  const pop = document.createElement('div');
  pop.className = 'pop'; pop.innerHTML = html;
  pop.dataset.anchor = anchor.dataset.seg || 'slash';
  sheet.appendChild(pop);
  const cR = sheet.getBoundingClientRect(), aR = anchor.getBoundingClientRect();
  pop.style.bottom = (cR.bottom - aR.top + 6) + 'px';
  if (opts.right) pop.style.right = Math.max(8, cR.right - aR.right) + 'px';
  else pop.style.left = Math.min(Math.max(8, aR.left - cR.left - 4), cR.width - 196) + 'px';
  if (opts.width) pop.style.width = opts.width + 'px';
  requestAnimationFrame(() => pop.classList.add('open'));
  if (anchor.dataset && anchor.dataset.seg) anchor.classList.add('open');
  curPop = pop;
  return pop;
}
function optRow(label, sel, data, desc){
  return '<button class="opt' + (sel ? ' sel' : '') + '" ' + data + '><span class="ck">' + I.check + '</span>' + label + (desc ? '<span class="desc">' + desc + '</span>' : '') + '</button>';
}
document.addEventListener('click', e => {
  if (curPop && !curPop.contains(e.target) && !e.target.closest('.meta button')) closePop();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePop(); });

/* ---------------------------------------------------------------- status strip */
function statusRun(){
  const streaming = mode === 'streaming';
  return '<div class="s-row"><span class="s-tag">' + (streaming ? 'Streaming' : 'Thinking') + '</span>' +
    '<span class="s-mid">â€”</span><span class="s-txt" id="sstep">' + (streaming ? 'composing response Â· 0 tokens' : STEPS[0]) + '</span>' +
    '<span class="steered" id="steered" hidden>Steer noted</span><span class="s-sp"></span>' +
    '<span class="s-time" id="stime">' + fmt(elapsed) + '</span>' +
    '<button class="tbtn" data-act="pause" id="pausebtn">' + (paused ? 'Resume' : 'Pause') + '</button>' +
    '<span class="s-mid">Â·</span>' +
    '<button class="tbtn danger" data-act="stop">Stop</button></div>';
}
function statusDiff(){
  return '<div class="s-row"><span class="s-tag">Changes</span><span class="s-mid">â€”</span>' +
    '<span class="s-txt">3 files <span class="s-num add">+383</span> <span class="s-num del">âˆ’4</span> Â· ready for review</span><span class="s-sp"></span>' +
    '<button class="tbtn" data-act="review">Review</button><span class="s-mid">Â·</span>' +
    '<button class="tbtn" data-act="apply">Apply</button><span class="s-mid">Â·</span>' +
    '<button class="tbtn" data-act="dismiss">Dismiss</button></div>' +
    '<div class="s-sub" id="ssub"><div class="s-subclip"><div class="s-files">' +
      '<div class="s-file"><span class="n">src/harness/state.ts</span><span class="s-num add">+212</span><span class="s-num del">âˆ’3</span></div>' +
      '<div class="s-file"><span class="n">system/harness/variants/chatbars/chatbar-08.html</span><span class="s-num add">+154</span><span class="s-num del">âˆ’1</span></div>' +
      '<div class="s-file"><span class="n">system/harness/README.md</span><span class="s-num add">+17</span><span class="s-num del">âˆ’0</span></div>' +
    '</div></div></div>';
}
function statusApproval(){
  return '<div class="s-row"><span class="s-tag warn">Approval</span><span class="s-mid">â€”</span>' +
    '<span class="s-txt"><code>Run: bun test tests</code> Â· in wt-052c59c7</span><span class="s-sp"></span>' +
    '<button class="tbtn" data-act="once">Allow</button><span class="s-mid">Â·</span>' +
    '<button class="tbtn" data-act="session">Session</button><span class="s-mid">Â·</span>' +
    '<button class="tbtn danger" data-act="deny">Deny</button></div>';
}
function bindStatus(){
  status.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => {
    const a = b.dataset.act;
    if (a === 'pause') togglePause();
    else if (a === 'stop'){ setMode('idle'); toast('Agent stopped'); }
    else if (a === 'review'){ const s = $('#ssub'); if (s) s.classList.toggle('open'); }
    else if (a === 'apply'){ toast('Changes applied to ' + project); setMode('idle'); }
    else if (a === 'dismiss'){ setMode('idle'); toast('Dismissed'); }
    else if (a === 'once'){ toast('Allowed once â€” resuming'); setMode('thinking'); }
    else if (a === 'session'){ toast('Allowed for this session'); setMode('thinking'); }
    else if (a === 'deny'){ toast('Command denied'); setMode('idle'); }
  }));
}

/* ---------------------------------------------------------------- timers */
function fmt(s){ return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function clearTimers(){ [timerInt, stepInt, tokInt].forEach(i => i && clearInterval(i)); timerInt = stepInt = tokInt = null; }
function startTimers(){
  clearTimers();
  timerInt = setInterval(() => {
    if (paused) return;
    elapsed++;
    const el = $('#stime'); if (el) el.textContent = fmt(elapsed);
  }, 1000);
  if (mode === 'thinking'){
    stepInt = setInterval(() => {
      if (paused) return;
      stepIdx = (stepIdx + 1) % STEPS.length;
      const el = $('#sstep'); if (el) el.textContent = STEPS[stepIdx];
    }, 2600);
  }
  if (mode === 'streaming'){
    tokInt = setInterval(() => {
      if (paused) return;
      tokens += 7 + Math.floor(Math.random() * 14);
      const el = $('#sstep'); if (el) el.textContent = 'composing response Â· ' + tokens + ' tokens';
      if (Math.random() < 0.25){ ctxPct = Math.min(62, ctxPct + 1); drawCtx(); }
    }, 420);
  }
}
function togglePause(){
  paused = !paused;
  const pb = $('#pausebtn'); if (pb) pb.textContent = paused ? 'Resume' : 'Pause';
  const st = $('#sstep');
  if (paused && st){ st.dataset.prev = st.textContent; st.textContent = 'paused â€” output held'; }
  else if (st && st.dataset.prev){ st.textContent = st.dataset.prev; delete st.dataset.prev; }
  orb.set(paused ? 0.18 : running() ? 1 : 0);
  toast(paused ? 'Paused' : 'Resumed');
}

/* ---------------------------------------------------------------- mode */
function setMode(m){
  mode = m; paused = false; stepIdx = 0; tokens = 0;
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  closePop();

  if (m === 'idle'){
    statuswrap.classList.remove('open');
    status.innerHTML = '';
    clearTimers(); elapsed = 0;
    orb.set(0);
  } else {
    status.innerHTML = m === 'diff' ? statusDiff() : m === 'approval' ? statusApproval() : statusRun();
    statuswrap.classList.add('open');
    bindStatus();
    if (running()){ orb.set(1); startTimers(); }
    else { orb.set(0); clearTimers(); }
  }

  const isRun = running();
  write.classList.toggle('running', isRun);
  ta.placeholder = isRun ? 'Steer the agent â€” type guidanceâ€¦' : 'Write a messageâ€¦';
  syncSend();
}
function syncSend(){ sendBtn.classList.toggle('ready', ta.value.trim().length > 0 || running()); }

/* ---------------------------------------------------------------- ctx mini ring */
function drawCtx(){
  $('#v-ctx').textContent = ctxPct + '% ctx';
  const C = 38.96;
  $('#mini-arc').style.strokeDashoffset = (C * (1 - ctxPct / 100)).toFixed(2);
}

/* ---------------------------------------------------------------- textarea + send */
function autosize(){ ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 200) + 'px'; }
ta.addEventListener('input', () => { autosize(); syncSend(); slashWatch(); });
ta.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); doSend(); }
});
function doSend(){
  const v = ta.value.trim();
  if (!v) return;
  ta.value = ''; autosize(); syncSend();
  if (running()){
    const s = $('#steered');
    if (s){ s.hidden = false; setTimeout(() => { s.hidden = true; }, 2400); }
    toast('Steered: â€œ' + (v.length > 52 ? v.slice(0, 52) + 'â€¦' : v) + 'â€');
  } else {
    toast('Message sent â€” agent started');
    setMode('thinking');
  }
}
sendBtn.addEventListener('click', doSend);

/* ---------------------------------------------------------------- slash menu */
const SLASH = [
  ['/plan',   'Switch to planning mode'],
  ['/tests',  'Run test suite'],
  ['/review', 'Request code review'],
  ['/diff',   'Show pending diff'],
  ['/steer',  'Steer the running agent'],
  ['/compact','Compact context window']
];
function slashHtml(items){
  return '<div class="pop-h">Commands</div>' + items.map(s =>
    '<button class="opt" data-cmd="' + s[0] + '"><span style="font-family:var(--mono);font-size:11.5px;color:var(--ink)">' + s[0] + '</span><span class="desc">' + s[1] + '</span></button>'
  ).join('');
}
function bindSlash(pop){
  pop.querySelectorAll('[data-cmd]').forEach(b => b.addEventListener('click', () => {
    ta.value = ''; autosize(); syncSend(); closePop(); ta.focus();
    toast(b.dataset.cmd + ' â€” ' + SLASH.find(x => x[0] === b.dataset.cmd)[1].toLowerCase());
    if (b.dataset.cmd === '/diff') setMode('diff');
    if (b.dataset.cmd === '/steer' && !running()) setMode('thinking');
  }));
}
function slashWatch(){
  const v = ta.value;
  if (/^\/\w*$/.test(v)){
    const q = v.slice(1).toLowerCase();
    const items = SLASH.filter(s => s[0].slice(1).startsWith(q));
    if (!items.length){ closePop(); return; }
    if (curPop && curPop.dataset.anchor === 'slash'){ curPop.innerHTML = slashHtml(items); bindSlash(curPop); return; }
    const pop = openPop(ta, slashHtml(items), { width: 236, anchor: 'slash' });
    if (pop) bindSlash(pop);
  } else if (curPop && curPop.dataset.anchor === 'slash') closePop();
}

/* ---------------------------------------------------------------- segment micro-popovers */
const SEGMENTS = {
  model(btn){
    const models = ['SWE-2 High', 'DeepSeek V4.1', 'Mistral Large 4', 'GLM-5.3'];
    const pop = openPop(btn, '<div class="pop-h">Model</div>' +
      models.map(m => optRow(m, m === model, 'data-v="' + m + '"')).join(''), { width: 204 });
    if (!pop) return;
    pop.querySelectorAll('[data-v]').forEach(b => b.addEventListener('click', () => {
      model = b.dataset.v; $('#v-model').textContent = model; closePop(); toast('Model â†’ ' + model);
    }));
  },
  effort(btn){
    const list = ['Low', 'Medium', 'High', 'Max'];
    const pop = openPop(btn, '<div class="pop-h">Reasoning effort</div>' +
      list.map(e => optRow(e, e === effort, 'data-v="' + e + '"')).join(''), { width: 204 });
    if (!pop) return;
    pop.querySelectorAll('[data-v]').forEach(b => b.addEventListener('click', () => {
      effort = b.dataset.v; $('#v-effort').textContent = effort; closePop(); toast('Effort â†’ ' + effort);
    }));
  },
  autonomy(btn){
    const list = [['Ask','approve each step'],['Scoped','approved scope'],['Medium','auto edits'],['Auto-High','full autonomy']];
    const pop = openPop(btn, '<div class="pop-h">Autonomy</div>' +
      list.map(o => optRow(o[0], o[0] === autonomy, 'data-v="' + o[0] + '"', o[1])).join(''), { width: 228 });
    if (!pop) return;
    pop.querySelectorAll('[data-v]').forEach(b => b.addEventListener('click', () => {
      autonomy = b.dataset.v; $('#v-autonomy').textContent = autonomy; closePop(); toast('Autonomy â†’ ' + autonomy);
    }));
  },
  project(btn){
    const pop = openPop(btn, '<div class="pop-h">Project</div>' +
      optRow('Roblox_Game_Rom', false, 'data-v="Roblox_Game_Rom"') +
      optRow('bot-factory', true, 'data-v="bot-factory"') +
      '<div class="pop-div"></div><div class="pop-h">Worktree</div>' +
      optRow('main Â· bot-factory', false, 'data-v="main"') +
      optRow('wt-052c59c7 Â· feat/chatbars', true, 'data-v="wt-052c59c7"') +
      optRow('wt-9f31ab02 Â· fix/auth', false, 'data-v="wt-9f31ab02"'), { width: 236 });
    if (!pop) return;
    pop.querySelectorAll('[data-v]').forEach(b => b.addEventListener('click', () => {
      project = b.dataset.v; $('#v-project').textContent = project; closePop(); toast('Project â†’ ' + project);
    }));
  },
  ctx(btn){
    const tok = Math.round(ctxPct * 2000) / 10;
    const pop = openPop(btn,
      '<div class="ctx-row"><span>Context used</span><b>' + ctxPct + '%</b></div>' +
      '<div class="ctx-track"><i style="width:' + ctxPct + '%"></i></div>' +
      '<div class="ctx-row"><span>Tokens</span><b>' + tok.toFixed(1) + 'k / 200k</b></div>' +
      '<div class="ctx-row"><span>Files in context</span><b>12</b></div>' +
      '<div class="ctx-row"><span>Turns</span><b>8</b></div>' +
      '<div class="pop-div"></div>' +
      '<button class="opt" data-c="1">Compact context</button>', { right: true, width: 204 });
    if (!pop) return;
    pop.querySelector('[data-c]').addEventListener('click', () => {
      ctxPct = 21; drawCtx(); closePop(); toast('Context compacted â†’ 21%');
    });
  }
};
document.querySelectorAll('.meta button').forEach(b =>
  b.addEventListener('click', e => { e.stopPropagation(); SEGMENTS[b.dataset.seg](b); }));

/* ---------------------------------------------------------------- sim buttons */
document.querySelectorAll('#seg button').forEach(b =>
  b.addEventListener('click', () => setMode(b.dataset.m)));

drawCtx();
autosize();
setMode('idle');
ta.focus();
</script>
